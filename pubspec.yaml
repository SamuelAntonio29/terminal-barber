name: terminal_barber
description: "Terminal Barber - Agendamento de barbearia"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  cloud_firestore: ^5.6.0
  intl: ^0.20.2
  google_sign_in: ^6.2.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/logo2.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo2.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/logo2.png"
  min_sdk_android: 21